plugins {
    id 'dev.architectury.loom' version '1.17.491' apply false
    // Unobfuscated Minecraft (26.1+) builds through the no-remap variant of Loom.
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.3' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

// Java level per Minecraft generation: 1.20.x -> 17, 1.21.x -> 21, 26.x and newer -> 25.
def javaRelease = rootProject.minecraft_version.startsWith("1.20") ? 17
        : rootProject.minecraft_version.startsWith("1.21") ? 21
        : 25

// Everything before the 26.x naming scheme ships obfuscated and needs a mapping set.
def obfuscated = rootProject.minecraft_version.startsWith("1.")

subprojects {
    apply plugin: obfuscated ? 'dev.architectury.loom' : 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "$rootProject.archives_name-$project.name-$rootProject.minecraft_version"
    }

    repositories {
        maven { url "https://jitpack.io" }
        maven { url "https://maven.neoforged.net/releases/" }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        // Minecraft 26.1 and newer ship unobfuscated (Mojang no longer publishes mappings), so no mapping
        // set is applied there.
        if (obfuscated) {
            mappings loom.officialMojangMappings()
        }
    }

    java {
        def javaVer = JavaVersion.toVersion(javaRelease)
        sourceCompatibility = javaVer
        targetCompatibility = javaVer
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = javaRelease
    }

    afterEvaluate {
        tasks.withType(AbstractArchiveTask).configureEach {
            if (project.name != 'common'
                    && !name.toLowerCase().contains('source')
                    && !archiveClassifier.getOrElse('').toLowerCase().contains('dev')) {
                destinationDirectory = rootProject.layout.buildDirectory.dir("libs")
            }
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        repositories {

        }
    }
}
